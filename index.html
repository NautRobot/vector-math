<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Zouse of Zazards: Sibling Sabotage</title>
   <style>
       :root {
           --bg-color: #222;
           --text-color: #eee;
           --highlight: #007BFF;
           --danger: #DC3545;
       }
       body {
           font-family: Arial, sans-serif;
           background-color: var(--bg-color);
           color: var(--text-color);
           margin: 0;
           height: 100vh;
           display: flex;
           justify-content: center;
           align-items: center;
           overflow: hidden;
           user-select: none;
       }
       #decoy-container {
           text-align: center;
           border: 2px solid #555;
           padding: 40px;
           background: #333;
           box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
           cursor: pointer;
           border-radius: 8px;
       }
       #decoy-container h1 { margin-top: 0; color: #fff; }
       #sim-wrapper {
           display: none;
           position: relative;
           width: 1000px;
           height: 650px;
           background-color: #e0e0e0;
           box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
           border: 4px solid #444;
           border-radius: 8px;
           overflow: hidden;
       }
       canvas {
           display: block;
           width: 100%;
           height: 100%;
       }
       #ui-layer {
           position: absolute;
           top: 0; left: 0; width: 100%; height: 100%;
           pointer-events: none;
           display: flex;
           flex-direction: column;
           justify-content: space-between;
       }
       .hud-bar, .hud-footer {
           display: flex;
           justify-content: space-between;
           padding: 10px 20px;
           background: rgba(34, 34, 34, 0.9);
           font-weight: bold;
           font-size: 14px;
           border-bottom: 2px solid #444;
       }
       .hud-footer { border-bottom: none; border-top: 2px solid #444; }
       .message-box {
           position: absolute;
           top: 50%; left: 50%;
           transform: translate(-50%, -50%);
           background: #fff;
           color: #222;
           border: 4px solid #444;
           border-radius: 8px;
           padding: 30px;
           text-align: center;
           box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
           display: none;
       }
       .btn {
           background: var(--highlight);
           color: #fff;
           border: none;
           border-radius: 4px;
           padding: 12px 24px;
           font-size: 16px;
           font-weight: bold;
           cursor: pointer;
           pointer-events: auto;
           margin-top: 15px;
       }
       .btn:hover { background: #0056b3; }
       .player-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; color: white; }
   </style>
</head>
<body>
   <div id="decoy-container">
       <h1>Grandma's House Rules</h1>
       <p>A Co-Op Platforming Experience (With Sabotage)</p>
       <p style="margin-top:30px; font-size: 0.9em; color:#aaa;">[ DOUBLE CLICK TO START ]</p>
   </div>

   <div id="sim-wrapper">
       <canvas id="sim-canvas" width="1000" height="650"></canvas>
       <div id="ui-layer">
           <div class="hud-bar">
               <div><span class="player-tag" style="background: #007BFF">P1</span> W,A,S,D + <b>SPACE (Shove)</b></div>
               <div id="debuff-display" style="color: #DC3545; text-transform: uppercase;">MODIFIER: NONE</div>
               <div><span class="player-tag" style="background: #DC3545">P2</span> ARROWS + <b>SHIFT (Shove)</b></div>
           </div>
           <div class="message-box" id="msg-box">
               <h2 id="msg-title" style="margin:0 0 10px 0;"></h2>
               <p id="msg-desc" style="margin:0 0 15px 0; color:#555;"></p>
               <button class="btn" id="msg-btn">CONTINUE</button>
           </div>
           <div class="hud-footer">
               <div id="progress-tracker">TIER: 1 / 8</div>
           </div>
       </div>
   </div>

   <script>
       const decoy = document.getElementById('decoy-container');
       const wrapper = document.getElementById('sim-wrapper');
       const cvs = document.getElementById('sim-canvas');
       const ctx = cvs.getContext('2d');

       // External Images
       const imgGrandma = new Image();
       imgGrandma.src = "https://images.unsplash.com/photo-1531686264889-56fdcabd163f?w=150&h=150&fit=crop"; 
       
       const imgWalker = new Image();
       imgWalker.src = "https://plus.unsplash.com/premium_photo-1663089688180-444ff0066e5d?w=100&h=100&fit=crop"; 

       // Game Globals
       let activeSeq = false;
       let lastTime = 0;
       let camera = { x: 0, y: 0 };
       let screenShake = 0;
       let particles = [];
       let projectiles = [];
       let currentTier = 0;
       let activeDebuff = null;
       
       const TIER_HEIGHT = 450;
       const MAP_WIDTH = 4000;
       const TOTAL_TIERS = 8;

       const DEBUFFS = [
           { name: "ICE FLOOR", effect: (p) => p.friction = 0.99 },
           { name: "HEAVY GRAVITY", effect: (p) => { p.grav = 2000; p.jumpForce = 600; } },
           { name: "MOON JUMP", effect: (p) => { p.grav = 700; p.jumpForce = 500; } },
           { name: "SLUGGISH", effect: (p) => p.accel = 1000 }
       ];

       let mapData = { structures: [], traps: [], checkpoints: [], goals: [] };

       const keys = {
           p1: { left: false, right: false, up: false, action: false },
           p2: { left: false, right: false, up: false, action: false }
       };

       window.addEventListener('keydown', e => {
           if (e.code === 'KeyA') keys.p1.left = true;
           if (e.code === 'KeyD') keys.p1.right = true;
           if (e.code === 'KeyW') keys.p1.up = true;
           if (e.code === 'Space') keys.p1.action = true;
           
           if (e.code === 'ArrowLeft') keys.p2.left = true;
           if (e.code === 'ArrowRight') keys.p2.right = true;
           if (e.code === 'ArrowUp') keys.p2.up = true;
           if (e.code === 'ShiftRight' || e.code === 'ShiftLeft') keys.p2.action = true;
       });
       window.addEventListener('keyup', e => {
           if (e.code === 'KeyA') keys.p1.left = false;
           if (e.code === 'KeyD') keys.p1.right = false;
           if (e.code === 'KeyW') keys.p1.up = false;
           if (e.code === 'Space') keys.p1.action = false;
           
           if (e.code === 'ArrowLeft') keys.p2.left = false;
           if (e.code === 'ArrowRight') keys.p2.right = false;
           if (e.code === 'ArrowUp') keys.p2.up = false;
           if (e.code === 'ShiftRight' || e.code === 'ShiftLeft') keys.p2.action = false;
       });

       class Player {
           constructor(id, color, inputs) {
               this.id = id;
               this.color = color;
               this.inputs = inputs;
               this.w = 30; this.h = 30;
               this.dead = false;
               this.pushCooldown = 0;
               this.resetPhysics();
           }
           resetPhysics() {
               this.vx = 0; this.vy = 0;
               this.grounded = false;
               this.accel = 2500;
               this.friction = 0.82;
               this.grav = 1400;
               this.jumpForce = 750;
           }
           applyDebuff() {
               this.resetPhysics();
               if (activeDebuff) activeDebuff.effect(this);
           }
           spawnAt(cp) {
               this.x = cp.x;
               this.y = cp.y;
               this.dead = false;
               this.pushCooldown = 0;
               this.applyDebuff();
           }
           die() {
               if(this.dead) return;
               this.dead = true;
               screenShake = 15;
               for(let i=0; i<25; i++) particles.push(new Particle(this.x + this.w/2, this.y + this.h/2, this.color));
               checkTeamWipe();
           }
           update(dt, other) {
               if (this.dead) return;
               if (this.pushCooldown > 0) this.pushCooldown -= dt;

               // Sabotage Mechanics (Shove)
               if (this.inputs.action && this.pushCooldown <= 0 && !other.dead) {
                   let dx = other.x - this.x;
                   let dy = other.y - this.y;
                   if (Math.hypot(dx, dy) < 60) {
                       let dir = (dx > 0) ? 1 : -1;
                       other.vx = dir * 2000; 
                       other.vy = -500;
                       this.pushCooldown = 1.0;
                       screenShake = 8;
                       for(let i=0; i<10; i++) particles.push(new Particle(this.x+this.w/2, this.y+this.h/2, "#fff"));
                   }
               }

               if (this.inputs.left) this.vx -= this.accel * dt;
               if (this.inputs.right) this.vx += this.accel * dt;
               
               this.vx *= this.friction;
               this.vy += this.grav * dt;

               if (this.inputs.up && this.grounded) {
                   this.vy = -this.jumpForce;
                   this.grounded = false;
               }

               this.x += this.vx * dt;
               this.resolveMapCollision('x');
               this.y += this.vy * dt;
               this.grounded = false;
               this.resolveMapCollision('y');

               // Traps Collision
               for(let t of mapData.traps) {
                   if (t.checkHit(this)) this.die();
               }
               for(let p of projectiles) {
                   if(this.x < p.x+p.w && this.x+this.w > p.x && this.y < p.y+p.h && this.y+this.h > p.y) this.die();
               }

               // Check Goal
               for(let g of mapData.goals) {
                   if (g.tier === currentTier && this.x < g.x+g.w && this.x+this.w > g.x && this.y < g.y+g.h && this.y+this.h > g.y) {
                       reachCheckpoint(g.tier + 1);
                   }
               }

               if (this.y > (TOTAL_TIERS+1)*TIER_HEIGHT) this.die();
           }
           resolveMapCollision(axis) {
               for (let s of mapData.structures) {
                   if (this.x < s.x + s.w && this.x + this.w > s.x && this.y < s.y + s.h && this.y + this.h > s.y) {
                       if (axis === 'x') {
                           if (this.vx > 0) this.x = s.x - this.w;
                           else if (this.vx < 0) this.x = s.x + s.w;
                           this.vx = 0;
                       } else {
                           if (this.vy > 0) {
                               this.y = s.y - this.h;
                               this.grounded = true;
                           } else if (this.vy < 0) {
                               this.y = s.y + s.h;
                           }
                           this.vy = 0;
                       }
                   }
               }
           }
           draw() {
               if(this.dead) return;
               ctx.fillStyle = this.color;
               ctx.fillRect(this.x, this.y, this.w, this.h);
               // Draw cooldown indicator
               if(this.pushCooldown > 0) {
                   ctx.fillStyle = "rgba(255,255,255,0.5)";
                   ctx.fillRect(this.x, this.y + this.h - 5, this.w * (1 - this.pushCooldown), 5);
               }
           }
       }

       class Particle {
           constructor(x, y, color) {
               this.x = x; this.y = y;
               this.color = color;
               this.size = Math.random() * 6 + 4;
               this.life = 1.0;
               let angle = Math.random() * Math.PI * 2;
               let speed = Math.random() * 300 + 100;
               this.vx = Math.cos(angle) * speed;
               this.vy = Math.sin(angle) * speed;
           }
           update(dt) {
               this.x += this.vx * dt;
               this.y += this.vy * dt;
               this.life -= dt * 1.5;
           }
           draw() {
               if(this.life <= 0) return;
               ctx.globalAlpha = this.life;
               ctx.fillStyle = this.color;
               ctx.fillRect(this.x, this.y, this.size, this.size);
               ctx.globalAlpha = 1.0;
           }
       }

       // --- TRAPS ---
       class Trap {
           constructor(x, y) { this.x = x; this.y = y; this.active = true; }
           update(dt) {} draw() {} checkHit(p) { return false; }
       }

       class Spike extends Trap {
           constructor(x, y) { super(x, y); this.w = 40; this.h = 20; }
           checkHit(p) { return (p.x < this.x+this.w-5 && p.x+p.w > this.x+5 && p.y+p.h > this.y && p.y < this.y+this.h); }
           draw() {
               ctx.fillStyle = "#DC3545";
               ctx.beginPath();
               ctx.moveTo(this.x + this.w/2, this.y - 10);
               ctx.lineTo(this.x + this.w, this.y + this.h);
               ctx.lineTo(this.x, this.y + this.h);
               ctx.fill();
           }
       }

       class Mine extends Trap {
           constructor(x, y) { super(x, y); this.w = 30; this.h = 10; this.timer = -1; this.exploded = false; }
           update(dt) {
               if (this.timer > 0) {
                   this.timer -= dt;
                   if (this.timer <= 0) this.explode();
               }
           }
           explode() {
               this.timer = 0; this.exploded = true; screenShake = 20;
               [p1, p2].forEach(p => { if (!p.dead && Math.hypot(p.x - this.x, p.y - this.y) < 120) p.die(); });
               for(let i=0; i<30; i++) particles.push(new Particle(this.x, this.y, "#FFC107"));
           }
           checkHit(p) {
               if (this.exploded) return false;
               let hit = (p.x < this.x+this.w && p.x+p.w > this.x && p.y+p.h > this.y && p.y < this.y+this.h);
               if (hit && this.timer === -1) this.timer = 0.5; // arm mine
               return false;
           }
           draw() {
               if (this.exploded) return;
               ctx.fillStyle = (this.timer > 0 && Math.floor(this.timer*15)%2===0) ? "#DC3545" : "#444";
               ctx.beginPath(); ctx.arc(this.x+15, this.y+10, 15, Math.PI, 0); ctx.fill();
           }
       }

       class Crusher extends Trap {
           constructor(x, y) { super(x, y); this.w = 60; this.h = 200; this.baseY = y; this.timer = Math.random() * 2; }
           update(dt) {
               this.timer += dt;
               let cycle = this.timer % 3;
               if (cycle < 0.2) this.y = this.baseY + (cycle/0.2)*200; // Drop
               else if (cycle < 1.0) this.y = this.baseY + 200; // Hold
               else this.y = this.baseY + 200 - ((cycle-1.0)/2.0)*200; // Rise
           }
           checkHit(p) { return (p.x < this.x+this.w && p.x+p.w > this.x && p.y+p.h > this.y && p.y < this.y+this.h); }
           draw() {
               ctx.fillStyle = "#888"; ctx.fillRect(this.x, this.baseY, this.w, this.y - this.baseY);
               ctx.fillStyle = "#333"; ctx.fillRect(this.x, this.y, this.w, 40);
               ctx.fillStyle = "#FFC107"; ctx.fillRect(this.x, this.y + 35, this.w, 5); // Warning stripe
           }
       }

       class WalkerTrap extends Trap {
           constructor(x, y, range) {
               super(x, y);
               this.w = 70; this.h = 70;
               this.startX = x; this.maxX = x + range;
               this.vx = 250;
           }
           update(dt) {
               this.x += this.vx * dt;
               if (this.x > this.maxX) { this.x = this.maxX; this.vx *= -1; }
               if (this.x < this.startX) { this.x = this.startX; this.vx *= -1; }
           }
           checkHit(p) { return (p.x < this.x+this.w && p.x+p.w > this.x && p.y+p.h > this.y && p.y < this.y+this.h); }
           draw() {
               if (imgWalker.complete && imgWalker.naturalHeight !== 0) {
                   ctx.drawImage(imgWalker, this.x, this.y, this.w, this.h);
               } else {
                   ctx.fillStyle = "#666"; ctx.fillRect(this.x, this.y, this.w, this.h);
                   ctx.fillStyle = "#fff"; ctx.fillText("WALKER", this.x+5, this.y+35);
               }
           }
       }

       class Emitter extends Trap {
           constructor(x, y, dir) { super(x, y); this.w = 30; this.h = 30; this.dir = dir; this.cd = Math.random(); }
           update(dt) {
               this.cd -= dt;
               if(this.cd <= 0) {
                   projectiles.push({x: this.x+10, y: this.y+10, w:12, h:12, vx: this.dir * 450});
                   this.cd = 1.5;
               }
           }
           draw() {
               ctx.fillStyle = "#333"; ctx.fillRect(this.x, this.y, this.w, this.h);
               ctx.fillStyle = "#DC3545"; ctx.fillRect(this.dir===1 ? this.x+20 : this.x, this.y+10, 10, 10);
           }
       }

       let p1 = new Player(1, "#007BFF", keys.p1);
       let p2 = new Player(2, "#DC3545", keys.p2);

       // --- MAP GENERATION ---
       function buildMap() {
           mapData = { structures: [], traps: [], checkpoints: [], goals: [] };
           
           mapData.structures.push({x: -100, y: 0, w: 100, h: TOTAL_TIERS * TIER_HEIGHT});
           mapData.structures.push({x: MAP_WIDTH, y: 0, w: 100, h: TOTAL_TIERS * TIER_HEIGHT});

           for(let i=0; i<TOTAL_TIERS; i++) {
               let y = i * TIER_HEIGHT;
               let floorY = y + TIER_HEIGHT - 40;
               let isLR = (i % 2 === 0);

               // Helper to mirror level design automatically left-to-right vs right-to-left
               const placeStruct = (xOff, yOff, w, h) => {
                   let actualX = isLR ? xOff : MAP_WIDTH - xOff - w;
                   mapData.structures.push({x: actualX, y: floorY + yOff, w, h});
               };
               const placeTrap = (TrapClass, w, xOff, yOff, ...args) => {
                   let actualX = isLR ? xOff : MAP_WIDTH - xOff - w;
                   mapData.traps.push(new TrapClass(actualX, floorY + yOff, ...args));
               };

               // Checkpoint and Goal
               let cpX = isLR ? 150 : MAP_WIDTH - 200;
               mapData.checkpoints.push({x: cpX, y: floorY - 60});
               let goalX = isLR ? MAP_WIDTH - 200 : 100;
               mapData.goals.push({x: goalX, y: floorY - 120, w: 100, h: 120, tier: i});

               // Unique Tier Designs
               if (i === 0) {
                   // TIER 1: Intro. Basic jumps.
                   placeStruct(0, 0, 800, 40);
                   placeStruct(1000, 0, 800, 40); placeTrap(Spike, 40, 1300, -20);
                   placeStruct(2000, 0, MAP_WIDTH - 2000, 40);
               } 
               else if (i === 1) {
                   // TIER 2: Crushers
                   placeStruct(0, 0, MAP_WIDTH, 40);
                   for(let d = 600; d < 3500; d += 600) {
                       placeTrap(Crusher, 60, d, -300);
                       placeStruct(d, -300, 60, 40); // ceiling anchor
                   }
               } 
               else if (i === 2) {
                   // TIER 3: The Hospital Hallway (Walkers)
                   placeStruct(0, 0, MAP_WIDTH, 40);
                   placeTrap(WalkerTrap, 70, 700, -70, 400);
                   placeTrap(WalkerTrap, 70, 1500, -70, 500);
                   placeTrap(WalkerTrap, 70, 2400, -70, 600);
               } 
               else if (i === 3) {
                   // TIER 4: Minefield & Emitters
                   placeStruct(0, 0, 500, 40);
                   placeStruct(700, 0, 1200, 40);
                   placeTrap(Mine, 30, 900, -10); placeTrap(Mine, 30, 1200, -10); placeTrap(Mine, 30, 1500, -10);
                   placeStruct(2100, -100, 300, 40); placeTrap(Emitter, 30, 2250, -130, isLR ? -1 : 1);
                   placeStruct(2600, 0, MAP_WIDTH - 2600, 40);
               }
               else if (i === 4) {
                   // TIER 5: Platforming Over Void
                   placeStruct(0, 0, 400, 40);
                   for(let d = 600; d < 3200; d += 350) {
                       placeStruct(d, (d%700===0) ? -50 : 0, 150, 40);
                       if (d%2 !== 0) placeTrap(Spike, 40, d+50, (d%700===0) ? -70 : -20);
                   }
                   placeStruct(3400, 0, MAP_WIDTH-3400, 40);
               }
               else if (i === 5) {
                   // TIER 6: Chaos Mix
                   placeStruct(0, 0, MAP_WIDTH, 40);
                   placeTrap(Crusher, 60, 800, -300); placeStruct(800, -300, 60, 40);
                   placeTrap(WalkerTrap, 70, 1200, -70, 400);
                   placeTrap(Mine, 30, 1800, -10);
                   placeTrap(Emitter, 30, 2400, -30, isLR ? -1 : 1);
                   placeTrap(Crusher, 60, 2800, -300); placeStruct(2800, -300, 60, 40);
               }
               else if (i === 6) {
                   // TIER 7: Walker Gauntlet
                   placeStruct(0, 0, MAP_WIDTH, 40);
                   for(let d = 500; d < 3500; d += 450) {
                       placeTrap(WalkerTrap, 70, d, -70, 200);
                       placeStruct(d+100, -120, 80, 20); // platforms above them
                   }
               }
               else if (i === 7) {
                   // TIER 8: The Final Stretch to Grandma
                   placeStruct(0, 0, MAP_WIDTH, 40);
                   placeTrap(Crusher, 60, 1000, -300); placeStruct(1000, -300, 60, 40);
                   placeTrap(Mine, 30, 1500, -10);
                   placeTrap(WalkerTrap, 70, 2000, -70, 600);
                   placeTrap(Emitter, 30, 3000, -40, isLR ? -1 : 1);
               }
           }
       }

       function checkTeamWipe() {
           if (p1.dead && p2.dead) {
               activeSeq = false;
               activeDebuff = DEBUFFS[Math.floor(Math.random() * DEBUFFS.length)];
               document.getElementById('debuff-display').innerText = `MODIFIER: ${activeDebuff.name}`;
               
               showDialog("DOUBLE KO", `Both grandchildren have perished.<br><br>Grandma applies: <strong style="color:var(--danger)">${activeDebuff.name}</strong>`, "TRY AGAIN", () => {
                   hideDialog();
                   respawnTeam(currentTier);
               });
           }
       }

       function reachCheckpoint(tier) {
           if (tier > currentTier) {
               currentTier = tier;
               document.getElementById('progress-tracker').innerText = `TIER: ${currentTier + 1} / ${TOTAL_TIERS}`;
               if (currentTier >= TOTAL_TIERS) {
                   activeSeq = false;
                   showDialog("YOU MADE IT", "You successfully navigated the hazards and reached Grandma.", "PLAY AGAIN", () => location.reload());
               } else {
                   if (p1.dead) p1.spawnAt(mapData.checkpoints[currentTier]);
                   if (p2.dead) p2.spawnAt(mapData.checkpoints[currentTier]);
               }
           }
       }

       function respawnTeam(tier) {
           projectiles = [];
           mapData.traps.forEach(t => { if(t instanceof Mine) { t.timer = -1; t.exploded = false; } });
           p1.spawnAt(mapData.checkpoints[tier]);
           p2.spawnAt(mapData.checkpoints[tier]);
           activeSeq = true;
           lastTime = performance.now();
           requestAnimationFrame(gameLoop);
       }

       function showDialog(title, desc, btnText, action) {
           const box = document.getElementById('msg-box');
           document.getElementById('msg-title').innerHTML = title;
           document.getElementById('msg-desc').innerHTML = desc;
           const btn = document.getElementById('msg-btn');
           btn.innerText = btnText;
           btn.onclick = action;
           box.style.display = 'block';
       }
       function hideDialog() { document.getElementById('msg-box').style.display = 'none'; }

       function gameLoop(time) {
           if (!activeSeq) return;
           let dt = (time - lastTime) / 1000;
           lastTime = time;
           if (dt > 0.1) dt = 0.1; 

           // Update
           p1.update(dt, p2);
           p2.update(dt, p1);
           
           mapData.traps.forEach(t => t.update(dt));
           
           for(let i=projectiles.length-1; i>=0; i--) {
               let p = projectiles[i];
               p.x += p.vx * dt;
               let hitWall = mapData.structures.some(s => p.x < s.x+s.w && p.x+p.w > s.x && p.y < s.y+s.h && p.y+p.h > s.y);
               if (hitWall) projectiles.splice(i,1);
           }

           for(let i=particles.length-1; i>=0; i--) {
               particles[i].update(dt);
               if (particles[i].life <= 0) particles.splice(i,1);
           }

           // Camera Tracking
           let tx = 0, ty = 0, count = 0;
           if (!p1.dead) { tx += p1.x; ty += p1.y; count++; }
           if (!p2.dead) { tx += p2.x; ty += p2.y; count++; }
           if (count > 0) {
               tx /= count; ty /= count;
               camera.x += (tx - cvs.width/2 - camera.x) * 5 * dt;
               camera.y += (ty - cvs.height/2 - camera.y) * 5 * dt;
           }
           
           if (camera.x < -100) camera.x = -100;
           if (camera.x > MAP_WIDTH - cvs.width + 100) camera.x = MAP_WIDTH - cvs.width + 100;

           if (screenShake > 0) {
               camera.x += (Math.random()-0.5)*screenShake;
               camera.y += (Math.random()-0.5)*screenShake;
               screenShake -= 40 * dt;
           }

           // --- DRAW ---
           ctx.fillStyle = "#e0e0e0"; // Light clean background
           ctx.fillRect(0, 0, cvs.width, cvs.height);

           ctx.save();
           ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

           // Grid background
           ctx.strokeStyle = "#ccc";
           ctx.lineWidth = 1;
           ctx.beginPath();
           let startX = Math.floor(camera.x / 100) * 100;
           let startY = Math.floor(camera.y / 100) * 100;
           for(let x = startX; x < camera.x + cvs.width; x += 100) { ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y+cvs.height); }
           for(let y = startY; y < camera.y + cvs.height; y += 100) { ctx.moveTo(camera.x, y); ctx.lineTo(camera.x+cvs.width, y); }
           ctx.stroke();

           // Tier markers
           ctx.fillStyle = "rgba(0,0,0,0.1)";
           ctx.font = "bold 120px Arial";
           for(let i=0; i<TOTAL_TIERS; i++) {
               ctx.fillText(`FLOOR ${i+1}`, MAP_WIDTH/2 - 200, i*TIER_HEIGHT + TIER_HEIGHT/2);
           }

           // Goals & Grandma
           for(let g of mapData.goals) {
               if (g.tier === TOTAL_TIERS - 1) {
                   if (imgGrandma.complete && imgGrandma.naturalHeight !== 0) {
                       ctx.drawImage(imgGrandma, g.x, g.y, g.w, g.h);
                   } else {
                       ctx.fillStyle = "pink"; ctx.fillRect(g.x, g.y, g.w, g.h);
                       ctx.fillStyle = "black"; ctx.font="20px Arial"; ctx.fillText("GRANDMA", g.x, g.y+50);
                   }
               } else {
                   ctx.fillStyle = "rgba(40, 167, 69, 0.4)"; // Safe zone green
                   ctx.fillRect(g.x, g.y, g.w, g.h);
               }
           }

           // Structures
           for(let s of mapData.structures) {
               ctx.fillStyle = "#222";
               ctx.fillRect(s.x, s.y, s.w, s.h);
               ctx.fillStyle = "#555";
               ctx.fillRect(s.x, s.y, s.w, 4); // Top edge
           }

           mapData.traps.forEach(t => t.draw());
           
           ctx.fillStyle = "#FFC107";
           projectiles.forEach(p => {
               ctx.beginPath(); ctx.arc(p.x+6, p.y+6, 6, 0, Math.PI*2); ctx.fill();
           });

           p1.draw();
           p2.draw();
           particles.forEach(p => p.draw());

           ctx.restore();

           if (activeSeq) requestAnimationFrame(gameLoop);
       }

       decoy.addEventListener('dblclick', () => {
           decoy.style.display = 'none';
           wrapper.style.display = 'block';
           buildMap();
           
           showDialog("VISIT GRANDMA", "Navigate through 8 unique floors to reach Grandma's living room.<br><br>Beware of her <b>rogue Walkers</b>, Crushers, and Landmines.<br><br><i>Pro Tip:</i> Press <b>SPACE</b> or <b>SHIFT</b> to shove the other player into traps.", "ENTER HOUSE", () => {
               hideDialog();
               respawnTeam(0);
           });
       });
   </script>
</body>
